<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme"),p=q.get("palette");if(t)document.documentElement.setAttribute("data-theme",t);if(p)document.documentElement.setAttribute("data-palette",p);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script><meta charset="utf-8"><title>PalettePicker — 미리보기</title>
<style>html,body{margin:0;background:var(--paper);} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} .demo{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;}</style></head>
<body>
<div id="root" class="bl-root"></div>
<script>
  var B = window.Blurssism, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(el); }
  function Demo() {
    var st = React.useState(true);
    return h(React.Fragment, null,
      h(B.PalettePicker, null),
      h("div", { className: "demo" },
        h(B.Button, { variant: "accent", icon: "plus" }, "새로 만들기"),
        h(B.Chip, { selected: true }, "선택됨"),
        h(B.Badge, { tone: "accent" }, "새 기능"),
        h(B.Switch, { label: "알림", checked: st[0], onChange: st[1] }),
        h(B.PalettePicker, { compact: true, apply: false, value: "blue", group: "web", label: "웹 기본만, 작은 크기 예시" })));
  }
  mount(h(Demo));
</script>
</body>
</html>
