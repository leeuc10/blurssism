<div id="root" class="bl-root"></div>
<script>
  var B = window.Blurssism, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(el); }
  function Demo() {
    var st = React.useState(new Date(2026, 9, 17));
    return h(B.Calendar, { value: st[0], onChange: st[1], today: new Date(2026, 9, 6), min: new Date(2026, 9, 3) });
  }
  mount(h(Demo));
</script>
