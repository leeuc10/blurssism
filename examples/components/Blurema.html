<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/fonts.css">
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme"),p=q.get("palette"),b=q.get("background");if(t)document.documentElement.setAttribute("data-theme",t);if(p)document.documentElement.setAttribute("data-palette",p);if(b)document.documentElement.setAttribute("data-background",b);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script><meta charset="utf-8"><title>Blurema — 미리보기</title>
<style>html,body{margin:0;background:var(--paper);} body{padding:16px;} .layers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;} .stage{position:relative;height:200px;border-radius:var(--radius-lg);overflow:hidden;} .pane{position:absolute;inset:28px 20px;border-radius:var(--radius-lg);display:grid;place-items:end start;padding:14px 16px;font-size:14px;line-height:20px;font-weight:600;color:var(--ink);} .pane small{display:block;font-weight:400;color:var(--ink-muted);font-size:12px;line-height:16px;} .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:20px;} .mode{display:grid;gap:8px;} .mode h3{margin:0;font-size:14px;line-height:20px;font-weight:600;color:var(--ink);} .mode p{margin:0;font-size:12px;line-height:17px;color:var(--ink-muted);} .scene{position:relative;height:250px;border-radius:var(--radius-lg);overflow:hidden;background:var(--paper);} .scene .txt{position:absolute;left:14px;right:14px;top:6px;margin:0;font-family:var(--font-serif);font-weight:700;font-size:30px;line-height:36px;color:var(--ink);opacity:.85;word-break:keep-all;} .scene .stripes{position:absolute;left:0;right:0;bottom:0;height:120px;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,var(--deco) 10px 20px,var(--positive) 20px 30px,var(--paper) 30px 40px);} .scene .bar{position:absolute;left:12px;right:12px;top:22px;} .scene .float{position:absolute;left:12px;bottom:14px;display:flex;gap:8px;} .hint{margin:14px 0 0;font-size:13px;line-height:18px;color:var(--ink-muted);}</style>
</head>
<body>
<div id="root" class="bl-root"></div>
<script>
  var B = window.Blurssism, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(el); }
  function Blobs() {
    return [
      h("i", { key: 1, style: { left: "-30px", top: "-30px", width: "150px", height: "150px", background: "var(--deco)" } }),
      h("i", { key: 2, style: { left: "40%", top: "10px", width: "90px", height: "190px", borderRadius: "var(--radius-xl)", background: "var(--accent)" } }),
      h("i", { key: 3, style: { right: "-20px", bottom: "-30px", width: "160px", height: "100px", background: "var(--positive)" } })];
  }
  // 단계 비교용: 위쪽은 밝게 비워 크레마 띠가 보이고, 아래쪽 도형으로 블러·결 차이가 보이게
  function LayerBlobs() {
    return [
      h("p", { key: 0, "aria-hidden": "true", style: { position: "absolute", left: "34px", top: "36px", margin: 0, fontFamily: "var(--font-serif)", fontWeight: 700, fontSize: "26px", lineHeight: "30px", color: "var(--ink)" } }, "크레마"),
      h("i", { key: 1, style: { left: "-20px", top: "96px", width: "120px", height: "120px", background: "var(--deco)" } }),
      h("i", { key: 2, style: { left: "45%", top: "84px", width: "70px", height: "140px", borderRadius: "var(--radius-xl)", background: "var(--accent)" } }),
      h("i", { key: 3, style: { right: "-20px", bottom: "-30px", width: "140px", height: "90px", background: "var(--positive)" } })];
  }
  var blur = "blur(var(--blur-md)) saturate(var(--crema-saturate))";
  var steps = [
    ["1. 블러", "뒤가 번지기만 한 상태", { backdropFilter: blur, WebkitBackdropFilter: blur }],
    ["2. 우유 거품 색", "흰 유리 대신 크림색 젖빛", { backdropFilter: blur, WebkitBackdropFilter: blur, background: "var(--crema-fill)" }],
    ["3. 거품 결", "고운 거품 결 노이즈", { backdropFilter: blur, WebkitBackdropFilter: blur, backgroundColor: "var(--crema-fill)", backgroundImage: "var(--crema-grain)" }],
    ["4. 크레마", "위쪽 가장자리의 캐러멜빛 크레마 띠", null]];
  var modes = [
    ["off", "끄기", "블러 없이 불투명. 저사양·절전·투명도 줄이기"],
    ["on", "기본", "블러 24px + 블러레마. 모바일과 일반 기기"],
    ["rich", "데스크톱", "블러 32px, 더 비치는 크레마, 두 겹 그림자. 이 미리보기는 포인터를 따라오는 빛을 켠 상태(앱에서는 pointerLight: true)"]];
  // 미리보기용: 포인터 빛 위치를 직접 넘깁니다 (실제 앱에서는 applyCremaPreference({ pointerLight: true })가 합니다. 2.0부터 기본 꺼짐)
  var raf = 0;
  window.addEventListener("pointermove", function (e) {
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = 0; document.documentElement.style.setProperty("--bl-light-x", e.clientX + "px"); document.documentElement.style.setProperty("--bl-light-y", e.clientY + "px"); });
  }, { passive: true });
  function Scene(p) {
    var m = p.m;
    return h("div", { className: "mode" },
      h("h3", null, m[1], " ", h("code", { style: { fontWeight: 400, color: "var(--ink-subtle)" } }, 'data-crema="' + m[0] + '"')),
      h("div", { className: "scene", "data-crema": m[0] },
        h("p", { className: "txt", "aria-hidden": "true" }, "우유 거품 위에 크레마를 얹은 블러레마"),
        h("div", { className: "stripes", "aria-hidden": "true" }),
        h("div", { className: "bar" }, h(B.NavBar, { title: "블러레마", actions: h(B.IconButton, { icon: "search", label: "검색" }) })),
        h("div", { className: "float" }, h(B.Button, { variant: "crema" }, "크레마 버튼"), h(B.IconButton, { icon: "heart", label: "좋아요" }))),
      h("p", null, m[2]));
  }
  function Demo() {
    return h(React.Fragment, null,
      h("div", { className: "layers" }, steps.map(function (s) {
        return h("div", { key: s[0], className: "stage bl-backdrop" }, LayerBlobs(),
          h("div", { className: "pane" + (s[2] ? "" : " bl-crema"), style: s[2] ? Object.assign({ border: "1px solid var(--crema-stroke)" }, s[2]) : null },
            h("span", null, s[0], h("small", null, s[1]))));
      })),
      h("div", { className: "modes" }, modes.map(function (m) { return h(Scene, { key: m[0], m: m }); })),
      h("p", { className: "hint" }, "데스크톱 칸 위로 마우스를 움직여 보세요. 실제 앱에서는 applyCremaPreference()가 기기에 맞춰 셋 중 하나를 고릅니다."));
  }
  mount(h(Demo));
</script>
</body>
</html>
