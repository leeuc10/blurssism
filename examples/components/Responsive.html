<style>html,body{margin:0;background:var(--paper);} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} body{padding:20px;} h3{margin:0 0 4px;font-size:18px;line-height:26px;} .lead{margin:0 0 16px;font-size:14px;line-height:22px;color:var(--ink-muted);} .bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:18px;} .bar div{padding:12px;border-radius:var(--radius-md);background:var(--paper-raised);border:1px solid var(--line);font-size:12px;line-height:18px;color:var(--ink-muted);} .bar b{display:block;font-size:16px;line-height:22px;color:var(--ink);} .bar .cols{display:grid;gap:2px;margin-top:8px;} .bar .cols i{display:block;height:18px;border-radius:3px;background:var(--accent-soft);} table{width:100%;border-collapse:collapse;font-size:13px;line-height:20px;} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;} th{color:var(--ink-muted);font-weight:600;font-size:12px;}</style></head>
