<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/fonts.css">
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme"),p=q.get("palette"),b=q.get("background");if(t)document.documentElement.setAttribute("data-theme",t);if(p)document.documentElement.setAttribute("data-palette",p);if(b)document.documentElement.setAttribute("data-background",b);}catch(e){}</script>
<title>blurssism</title>
<style>
  /* 3.1 커버: 추상 도형 대신 "종이에 인쇄된 글 + 잔 자국" 위에 블러레마 한 장을 크게 띄웁니다.
     크레마 밑으로 실제 글줄과 자국이 지나가서 블러·거품 결·크레마 띠가 무엇을 하는 재질인지 바로 보입니다. 블러 예산 1. 뒤가 비쳐야 하는 자리라 얇은 크레마를 씁니다. */
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); z-index:2; }
  .name { margin:0; font-family:var(--font-serif); font-size:96px; line-height:.9; font-weight:700; letter-spacing:-.035em; color:var(--ink); }
  .tag { margin:var(--space-4) 0 0 4px; font-size:var(--text-body-sm-size); line-height:var(--text-body-sm-line); color:var(--ink-muted); }
  /* 종이: 직각, 인쇄된 글줄 */
  .page { position:absolute; left:448px; top:0; width:512px; height:288px; overflow:hidden; }
  .print { position:absolute; left:40px; top:28px; width:420px; margin:0; font-family:var(--font-serif); font-size:25px; line-height:40px; color:var(--ink); }
  .print span { color:var(--accent-ink); }
  .stain { position:absolute; width:300px; left:150px; top:-34px; }
  .stain-sm { width:120px; left:28px; top:176px; transform:rotate(200deg); }
  /* 크레마 한 장: 글줄과 자국 위에 */
  .pane { position:absolute; left:216px; top:92px; width:272px; height:152px; padding:var(--space-5); border-radius:var(--radius-lg);
    display:flex; flex-direction:column; justify-content:flex-end; gap:2px; }
  .pane b { font-size:var(--text-label-size); line-height:var(--text-label-line); font-weight:600; color:var(--ink); }
  .pane small { font-size:var(--text-caption-size); line-height:var(--text-caption-line); font-weight:500; color:var(--ink); }   /* 얇은 크레마 위 글자는 ink만 */
  @media (max-width: 767px) {
    .cover { width:100%; height:auto; }
    .page { position:relative; left:auto; width:100%; height:240px; }
    .print { left:var(--space-4); width:calc(100% - 2 * var(--space-4)); font-size:20px; line-height:32px; }
    .stain { left:auto; right:-40px; width:240px; }
    .pane { left:auto; right:var(--space-4); top:88px; width:min(240px, 64%); height:128px; }
    .words { position:static; padding:var(--space-5) var(--space-4) var(--space-1); }
    .name { font-size:clamp(56px, 17vw, 88px); }
  }
</style>
</head>
<body class="bl-root">
<div class="cover">
  <div class="page" aria-hidden="true">
    <p class="print">우유 거품 같은 종이 위에 <span>떠 있는 것만</span> 크레마로 띄웁니다. 색은 카페인에서 가져왔고, 블러는 한 화면에 셋까지만 씁니다.</p>
    <span class="bl-ring stain"></span>
    <span class="bl-ring bl-ring-deco stain stain-sm"></span>
    <div class="pane bl-crema"><b>블러레마</b><small>블러 · 우유 거품 색 · 거품 결 · 크레마 띠</small></div>
  </div>
  <div class="words">
    <p class="name">blurssism</p>
    <p class="tag">브랜드형 웹 화면을 위한 디자인 시스템 <span style="white-space:nowrap">— made by caffeinecat</span></p>
  </div>
</div>
</body>
</html>
