<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/fonts.css">
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme"),p=q.get("palette"),b=q.get("background");if(t)document.documentElement.setAttribute("data-theme",t);if(p)document.documentElement.setAttribute("data-palette",p);if(b)document.documentElement.setAttribute("data-background",b);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script>
<meta charset="utf-8">
<title>blurssism</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .accent { fill:var(--accent); }
  .deco { fill:var(--deco); }
  .positive { fill:var(--positive); }
  .deep { fill:var(--ink); }
  /* 블랙 팔레트(기본)에서는 강조색이 이미 검정이라, 먹색 판이 검정 판과 겹쳐 보이지 않게 크레마 갈색으로 */
  :root:not([data-palette]) .deep, [data-palette="black"] .deep { fill:var(--line-strong); }
  .dot { fill:var(--ink-muted); }
  .lg { rx:var(--radius-lg); }
  .pill { rx:32px; }
  .pane { fill:none; stroke:var(--crema-edge, var(--crema-stroke)); stroke-width:1.5; rx:var(--radius-lg); }
  .pane-fill { fill:var(--crema-fill); fill-opacity:.62; }
  .crema-stop { stop-color:var(--crema, #c0916a); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:88px; line-height:.92; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
  /* 좁은 화면(md 미만): 그림을 줄이지 않고 위에 그림, 아래에 이름을 쌓아 글자가 읽히는 크기로 둡니다 */
  @media (max-width: 767px) {
    .cover { width:100%; height:auto; }
    .art { position:relative; left:auto; width:100%; max-width:560px; height:auto; aspect-ratio:480 / 288; }
    .art svg { width:100%; height:100%; }
    .words { position:static; max-width:none; padding:var(--space-5) 0 var(--space-1); }
    .name { font-size:clamp(48px, 15vw, 72px); }
  }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent (espresso) 160×264 slab bled off the top (identity hue, largest) · deco (crema) disc r72 · positive capsule 176×64 · ink 112×200 bled off top and right edge — ≈40% of 960×288
  arrangement one tall accent slab with satellites, a glass pane laid across slab, disc and capsule
  pattern     the system's own motif: a Blurema pane (frosted crema-fill + foam grain + caramel crema band + lift shadow, rx radius-lg) blurring what lies under it, plus a 5×4 dot grid at space-4 pitch half under the pane so the blur reads — "떠 있는 것만 유리로"
  scales      sides in space-2 multiples; dot pitch space-4; corners radius-lg; capsule rx = half its 64px height (radius-full)
-->
<defs>
  <clipPath id="paneClip"><rect x="120" y="72" width="232" height="144" rx="24"/></clipPath>
  <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  <!-- 블러레마: 거품 결 · 크레마 띠 · 떠 있는 그림자 -->
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .38  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .62 0"/></filter>
  <filter id="lift" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#21180f" flood-opacity=".22"/></filter>
  <linearGradient id="crema" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" class="crema-stop" style="stop-opacity:.9"/>
    <stop offset=".06" class="crema-stop" style="stop-opacity:.62"/>
    <stop offset=".38" class="crema-stop" style="stop-opacity:.22"/>
    <stop offset=".75" class="crema-stop" style="stop-opacity:0"/>
  </linearGradient>
</defs>
<g id="scene">
  <rect class="accent lg" x="24" y="-24" width="160" height="264" rx="24"/>
  <circle class="deco" cx="248" cy="104" r="72"/>
  <rect class="positive pill" x="208" y="200" width="176" height="64" rx="32"/>
  <rect class="deep lg" x="392" y="-24" width="112" height="200" rx="24"/>
  <g class="dot">
    <circle cx="296" cy="40" r="3"/><circle cx="312" cy="40" r="3"/><circle cx="328" cy="40" r="3"/><circle cx="344" cy="40" r="3"/><circle cx="360" cy="40" r="3"/>
    <circle cx="296" cy="56" r="3"/><circle cx="312" cy="56" r="3"/><circle cx="328" cy="56" r="3"/><circle cx="344" cy="56" r="3"/><circle cx="360" cy="56" r="3"/>
    <circle cx="296" cy="72" r="3"/><circle cx="312" cy="72" r="3"/><circle cx="328" cy="72" r="3"/><circle cx="344" cy="72" r="3"/><circle cx="360" cy="72" r="3"/>
    <circle cx="296" cy="88" r="3"/><circle cx="312" cy="88" r="3"/><circle cx="328" cy="88" r="3"/><circle cx="344" cy="88" r="3"/><circle cx="360" cy="88" r="3"/>
  </g>
</g>
<rect x="120" y="72" width="232" height="144" rx="24" style="fill:var(--paper)" filter="url(#lift)"/>
<g clip-path="url(#paneClip)">
  <rect x="120" y="72" width="232" height="144" style="fill:var(--paper)"/>
  <use href="#scene" filter="url(#frost)"/>
  <rect class="pane-fill" x="120" y="72" width="232" height="144"/>
  <rect x="120" y="72" width="232" height="144" filter="url(#grain)"/>
  <rect x="120" y="72" width="232" height="144" fill="url(#crema)"/>
</g>
<rect class="pane" x="120" y="72" width="232" height="144" rx="24"/>
</svg>
</div>
<div class="words">
  <p class="name">blurssism</p>
  <p class="tag">글래스모피즘과 블러, 그리고 카페인 <span style="white-space:nowrap">— made by caffeinecat</span></p>
</div>
</div>
</body>
</html>
