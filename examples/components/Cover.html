<!doctype html>
<html lang="ko">
<head>
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script>
<meta charset="utf-8">
<title>blurssism</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .accent { fill:var(--accent); }
  .apricot { fill:var(--apricot); }
  .positive { fill:var(--positive); }
  .deep { fill:var(--ink); }
  .dot { fill:var(--ink-muted); }
  .lg { rx:var(--radius-lg); }
  .pill { rx:32px; }
  .pane { fill:var(--glass-fill); stroke:var(--glass-stroke); stroke-width:1.5; rx:var(--radius-lg); }
  .pane-shade { fill:none; stroke:var(--line); stroke-width:1; rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:88px; line-height:.92; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 160×264 slab bled off the top (identity hue, largest) · apricot disc r72 · positive capsule 176×64 · ink 112×200 bled off top and right edge — ≈40% of 960×288
  arrangement one tall accent slab with satellites, a glass pane laid across slab, disc and capsule
  pattern     the system's own motif: a frosted pane (glass-fill + glass-stroke, rx radius-lg) blurring what lies under it, plus a 5×4 dot grid at space-4 pitch half under the pane so the blur reads — "떠 있는 것만 유리로"
  scales      sides in space-2 multiples; dot pitch space-4; corners radius-lg; capsule rx = half its 64px height (radius-full)
-->
<defs>
  <clipPath id="paneClip"><rect x="120" y="72" width="232" height="144" rx="24"/></clipPath>
  <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<g id="scene">
  <rect class="accent lg" x="24" y="-24" width="160" height="264" rx="24"/>
  <circle class="apricot" cx="248" cy="104" r="72"/>
  <rect class="positive pill" x="208" y="200" width="176" height="64" rx="32"/>
  <rect class="deep lg" x="392" y="-24" width="112" height="200" rx="24"/>
  <g class="dot">
    <circle cx="296" cy="40" r="3"/><circle cx="312" cy="40" r="3"/><circle cx="328" cy="40" r="3"/><circle cx="344" cy="40" r="3"/><circle cx="360" cy="40" r="3"/>
    <circle cx="296" cy="56" r="3"/><circle cx="312" cy="56" r="3"/><circle cx="328" cy="56" r="3"/><circle cx="344" cy="56" r="3"/><circle cx="360" cy="56" r="3"/>
    <circle cx="296" cy="72" r="3"/><circle cx="312" cy="72" r="3"/><circle cx="328" cy="72" r="3"/><circle cx="344" cy="72" r="3"/><circle cx="360" cy="72" r="3"/>
    <circle cx="296" cy="88" r="3"/><circle cx="312" cy="88" r="3"/><circle cx="328" cy="88" r="3"/><circle cx="344" cy="88" r="3"/><circle cx="360" cy="88" r="3"/>
  </g>
</g>
<g clip-path="url(#paneClip)">
  <rect x="120" y="72" width="232" height="144" style="fill:var(--paper)"/>
  <use href="#scene" filter="url(#frost)"/>
</g>
<rect class="pane" x="120" y="72" width="232" height="144" rx="24"/>
<rect class="pane-shade" x="119" y="71" width="234" height="146" rx="25"/>
</svg>
</div>
<div class="words">
  <p class="name">blurssism</p>
  <p class="tag">글래스모피즘과 블러의 조합 — made by caffeinecat</p>
</div>
</div>
</body>
</html>
