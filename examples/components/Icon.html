<!doctype html>
<html lang="ko">
<head>
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script><meta charset="utf-8"><title>Icon — 미리보기</title>
<style>html,body{margin:0;background:var(--paper);} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} .row{color:var(--ink);gap:20px;} .row svg{width:24px;height:24px;}</style></head>
<body>
<div id="root" class="bl-root"></div>
<script>
  var B = window.Blurssism, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(el); }
  var names = ["home", "search", "heart", "chat", "person", "bell", "settings", "plus", "spark", "check", "close", "chevron-left", "chevron-right", "alert"];
  mount(h("div", { className: "row" }, names.map(function (n) { return h(B.Icon, { key: n, name: n }); }),
    h("span", { style: { color: "var(--accent)" } }, h(B.Icon, { name: "heart", filled: true }))));
</script>
</body>
</html>
