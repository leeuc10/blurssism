<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/fonts.css">
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme"),p=q.get("palette"),b=q.get("background");if(t)document.documentElement.setAttribute("data-theme",t);if(p)document.documentElement.setAttribute("data-palette",p);if(b)document.documentElement.setAttribute("data-background",b);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script><meta charset="utf-8"><title>WebLanding — 미리보기</title>
<style>html,body{margin:0;background:var(--paper);} body{padding:0;} .site{width:1120px;transform-origin:0 0;--text-hero-size:80px;} .nav{position:sticky;top:12px;z-index:3;padding:0 24px;} .hero{display:grid;grid-template-columns:1fr 1.1fr;column-gap:48px;align-items:end;padding:64px 24px 64px;} .hero h1{grid-column:1 / -1;margin:0 0 40px;} .hero p{margin:0 0 32px;color:var(--ink-muted);max-width:440px;} .cta{display:flex;gap:8px;} .art{position:relative;height:300px;overflow:hidden;border-top:2px solid var(--ink);} .art .print{position:absolute;left:0;top:24px;right:24px;margin:0;font-family:var(--font-serif);font-size:var(--text-quote-size);line-height:var(--text-quote-line);color:var(--ink-muted);} .art .bl-ring{position:absolute;width:300px;right:-60px;top:20px;} .art .bl-ring-deco{width:140px;right:auto;left:24px;top:auto;bottom:-12px;transform:rotate(120deg);} .float{position:absolute;left:24px;right:0;bottom:32px;} .rules{display:grid;grid-template-columns:repeat(3,1fr);margin:0 24px 72px;padding:0;border-top:2px solid var(--ink);} .rules div{padding:20px 24px 0 0;} .rules div+div{padding-left:24px;border-left:1px solid var(--line-strong);} .rules dt{margin:0 0 8px;font-family:var(--font-serif);font-size:var(--text-title-1-size);line-height:var(--text-title-1-line);font-weight:700;letter-spacing:var(--text-title-1-tracking);} .rules dd{margin:0;color:var(--ink-muted);}</style></head>
<body>
<div id="root" class="bl-root"></div>
<script>
  var B = window.Blurssism, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(el); }
  function Site() {
    return h("div", { className: "site", id: "site" },
      h("div", { className: "nav" }, h(B.NavBar, { title: "blurssism", links: [{ href: "#", label: "소개", current: true }, { href: "#", label: "컴포넌트" }, { href: "#", label: "토큰" }, { href: "#", label: "블로그" }],
        actions: h(B.Button, { variant: "ghost", size: "md" }, "시작하기") })),
      h("section", { className: "hero" },
        h("h1", { className: "bl-hero" }, "조용한 종이 위에,", h("br"), "떠 있는 것만 크레마로."),
        h("div", null,
          h("p", { className: "bl-body" }, "글래스모피즘과 블러 효과를 웹과 앱에서 가독성 있게 조합하는 디자인 시스템이에요."),
          h("div", { className: "cta" }, h(B.Button, { variant: "primary" }, "컴포넌트 보기"), h(B.Button, null, "토큰 내려받기"))),
        h("div", { className: "art", "aria-hidden": "true" },
          h("p", { className: "print" }, "에스프레소를 막 내리면 캐러멜빛이 잔 전체에 퍼져 있다가, 천천히 위로 떠올라 띠로 고입니다."),
          h("span", { className: "bl-ring" }), h("span", { className: "bl-ring bl-ring-deco" }),
          h("div", { className: "float" }, h(B.Toast, { tone: "positive", actionLabel: "열기" }, "토큰 26개를 내보냈어요")))),
      h("dl", { className: "rules" },
        h("div", null, h("dt", null, "90 / 10"), h("dd", { className: "bl-body" }, "바탕은 종이와 먹이 90%, 강조색은 10% 이내로 써요.")),
        h("div", null, h("dt", null, "떠 있는 것만"), h("dd", { className: "bl-body" }, "내비게이션·시트·토스트만 크레마, 본문은 종이에 인쇄해요.")),
        h("div", null, h("dt", null, "행동 하나"), h("dd", { className: "bl-body" }, "primary 버튼은 한 화면에 하나만 둬요."))));
  }
  mount(h(Site));
  function fit() { var s = document.getElementById("site"); if (s) { var k = Math.min(1, window.innerWidth / 1120); s.style.transform = "scale(" + k + ")"; document.body.style.height = (s.offsetHeight * k) + "px"; } }
  setTimeout(fit, 0); window.addEventListener("resize", fit);
</script>
</body>
</html>
