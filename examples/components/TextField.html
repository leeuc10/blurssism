  mount(h(React.Fragment, null,
    h(B.TextField, { label: "이메일", type: "email", placeholder: "name@example.com", help: "로그인과 알림에 쓰여요." }),
    h(B.TextField, { label: "비밀번호", type: "password", defaultValue: "abc", error: "8자 이상 입력해 주세요." })));
</script>
