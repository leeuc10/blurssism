<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/fonts.css">
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme"),p=q.get("palette"),b=q.get("background");if(t)document.documentElement.setAttribute("data-theme",t);if(p)document.documentElement.setAttribute("data-palette",p);if(b)document.documentElement.setAttribute("data-background",b);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script><meta charset="utf-8"><title>Alert — 미리보기</title>
<style>html,body{margin:0;background:var(--paper);} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} #root{max-width:560px;display:grid;gap:16px;}</style></head>
<body>
<div id="root" class="bl-root"></div>
<script>
  var B = window.Blurssism, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(el); }
  function Demo() {
    var st = React.useState(true), shown = st[0], setShown = st[1];
    return h(React.Fragment, null,
      shown ? h(B.Alert, { title: "결제 수단이 바뀌어요", onDismiss: function () { setShown(false); } }, "다음 달 청구부터 새 카드로 결제돼요.") : null,
      h(B.Alert, { tone: "positive", title: "주문이 접수됐어요" }, "원두는 볶은 다음 날 보내 드려요. 보통 2일 안에 도착해요."),
      h(B.Alert, { tone: "warning", title: "저장 공간이 거의 찼어요", actions: h(B.Button, { variant: "ghost", size: "md" }, "정리하기") }, "사진을 더 올리려면 오래된 파일을 지우거나 용량을 늘려 주세요."),
      h(B.Alert, { tone: "danger", title: "결제가 되지 않았어요", actions: h(B.Button, { variant: "ghost", size: "md" }, "카드 바꾸기") }, "카드 한도나 유효기간을 확인하고 다시 시도해 주세요."));
  }
  mount(h(Demo));
</script>
</body>
</html>
