<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/fonts.css">
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme"),p=q.get("palette"),b=q.get("background");if(t)document.documentElement.setAttribute("data-theme",t);if(p)document.documentElement.setAttribute("data-palette",p);if(b)document.documentElement.setAttribute("data-background",b);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script><meta charset="utf-8"><title>Dialog — 미리보기</title>
<style>html,body{margin:0;background:var(--paper);} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} body{padding:0;height:360px;} .page{padding:16px;}</style></head>
<body>
<div id="root" class="bl-root"></div>
<script>
  var B = window.Blurssism, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(el); }
  function Demo() {
    var st = React.useState(true);
    return h("div", { className: "page" },
      h(B.Button, { onClick: function () { st[1](true); } }, "다이얼로그 열기"),
      h("p", { style: { color: "var(--ink-muted)" } }, "뒤 화면은 scrim으로 어두워지고 조작할 수 없게 됩니다."),
      h(B.Dialog, { open: st[0], onClose: function () { st[1](false); }, title: "이 기록을 삭제할까요?", description: "삭제하면 되돌릴 수 없어요. 공유한 사람들도 더 이상 볼 수 없어요.", alert: true },
        h(B.Button, { variant: "ghost", size: "md", onClick: function () { st[1](false); } }, "취소"),
        h(B.Button, { variant: "danger", size: "md", onClick: function () { st[1](false); } }, "삭제하기")));
  }
  mount(h(Demo));
</script>
</body>
</html>
