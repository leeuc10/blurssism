<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/fonts.css">
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme"),p=q.get("palette"),b=q.get("background");if(t)document.documentElement.setAttribute("data-theme",t);if(p)document.documentElement.setAttribute("data-palette",p);if(b)document.documentElement.setAttribute("data-background",b);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script><meta charset="utf-8"><title>Popover — 미리보기</title>
<style>html,body{margin:0;background:var(--paper);} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} body{padding:0;height:320px;} .page{padding:16px;} .deco{margin-top:16px;height:140px;border-radius:var(--radius-lg);background:linear-gradient(135deg,var(--deco),var(--accent-soft));}</style></head>
<body>
<div id="root" class="bl-root"></div>
<script>
  var B = window.Blurssism, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(el); }
  function Demo() {
    var sort = React.useState("recent"), only = React.useState(false);
    return h("div", { className: "page" },
      h("div", { className: "row" },
        h(B.Popover, { trigger: h(B.Button, { variant: "crema", size: "md" }, "정렬과 필터"), label: "정렬과 필터" },
          h("p", { className: "bl-popover-title" }, "정렬"),
          h(B.RadioGroup, { options: [{ value: "recent", label: "최근 저장한 순" }, { value: "name", label: "이름순" }], value: sort[0], onChange: function (v) { sort[1](v); } }),
          h("div", { className: "bl-popover-actions", style: { justifyContent: "space-between", alignItems: "center" } },
            h("span", { className: "bl-popover-body" }, "내가 만든 것만"),
            h(B.Switch, { checked: only[0], onChange: function (v) { only[1](v); }, label: "내가 만든 것만 보기" }))),
        h(B.Popover, { trigger: h(B.Button, { variant: "ghost", size: "md" }, "공유 설정"), placement: "bottom-end", label: "공유 설정" },
          h("p", { className: "bl-popover-title" }, "링크가 있는 사람 누구나"),
          h("p", { className: "bl-popover-body" }, "볼 수만 있어요. 편집 권한은 초대한 사람에게만 있어요."),
          h("div", { className: "bl-popover-actions" }, h(B.Button, { variant: "ghost", size: "md" }, "링크 복사")))),
      h("p", { style: { color: "var(--ink-muted)" } }, "바깥을 누르거나 Esc를 누르면 닫혀요. 아래가 모자라면 위로 떠요."),
      h("div", { className: "deco", "aria-hidden": "true" }));
  }
  mount(h(Demo));
</script>
</body>
</html>
