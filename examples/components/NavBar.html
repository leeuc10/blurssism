<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme"),p=q.get("palette");if(t)document.documentElement.setAttribute("data-theme",t);if(p)document.documentElement.setAttribute("data-palette",p);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script><meta charset="utf-8"><title>NavBar — 미리보기</title>
<style>html,body{margin:0;background:var(--paper);} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} #root{height:168px;border-radius:var(--radius-lg);overflow:hidden;} .stack{position:absolute;inset:16px;display:grid;gap:16px;align-content:start;}</style></head>
<body>
<div id="root" class="bl-root"></div>
<script>
  var B = window.Blurssism, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(el); }
  function Backdrop(kids) {
    return h("div", { className: "bl-backdrop", style: { height: "100%" } },
      h("i", { style: { left: "-40px", top: "-30px", width: "180px", height: "180px", background: "var(--deco)" } }),
      h("i", { style: { left: "38%", top: "20px", width: "120px", height: "220px", borderRadius: "var(--radius-xl)", background: "var(--accent)" } }),
      h("i", { style: { right: "-30px", bottom: "-40px", width: "200px", height: "120px", background: "var(--positive)" } }),
      kids);
  }
  mount(Backdrop(h("div", { className: "stack" },
    h(B.NavBar, { title: "설정", onBack: function () {}, actions: h(B.IconButton, { icon: "search", label: "검색", plain: true }) }),
    h(B.NavBar, { title: "blurssism", links: [{ href: "#", label: "소개", current: true }, { href: "#", label: "문서" }, { href: "#", label: "블로그" }],
      actions: h(B.Button, { size: "md" }, "시작하기") }))));
</script>
</body>
</html>
