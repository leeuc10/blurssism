<!doctype html>
<html lang="ko">
<head>
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="../../dist/bundle.css">
<script>try{var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../dist/bundle.js"></script><meta charset="utf-8"><title>ListItem — 미리보기</title>
<style>html,body{margin:0;background:var(--paper);} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} #root{max-width:400px;}</style></head>
<body>
<div id="root" class="bl-root"></div>
<script>
  var B = window.Blurssism, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(el); }
  function Demo() {
    var st = React.useState(true);
    return h("ul", { className: "bl-list" },
      h("li", null, h(B.ListItem, { icon: "person", title: "계정", subtitle: "name@example.com", href: "#" })),
      h("li", null, h(B.ListItem, { icon: "bell", title: "알림", trailing: h(B.Switch, { label: "알림", checked: st[0], onChange: st[1] }) })),
      h("li", null, h(B.ListItem, { icon: "settings", title: "언어", trailing: "한국어", onClick: function () {} })));
  }
  mount(h(Demo));
</script>
</body>
</html>
