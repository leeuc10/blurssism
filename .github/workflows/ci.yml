name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 빌드 결과가 커밋된 dist·svelte와 같은지
        run: |
          npm run build
          git diff --exit-code -- dist svelte src/svelte
      - name: 대비·타입·서버 렌더링 검사
        run: npm run check
      - name: 패키지 내용
        run: npm pack --dry-run

  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: 예시 페이지 스크린샷 (기준 이미지는 macOS에서 찍은 것이라 비교하지 않고 artifact로 올립니다)
        run: npx playwright test --update-snapshots
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: scripts/visual/snapshots
